<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f16"><title>Minecraft Skin Studio Ultra</title><link rel="stylesheet" href="styles.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="m" shape-rendering="crispEdges"><rect x="7" y="0" width="2" height="2" fill="#7c5cff"/><rect x="7" y="2" width="2" height="1" fill="#e6f7ff"/><rect x="2" y="3" width="12" height="8" fill="#22d3ee"/><rect x="2" y="3" width="12" height="1" fill="#a5f3fc"/><rect x="2" y="10" width="12" height="1" fill="#0e7490"/><rect x="3" y="5" width="10" height="4" fill="#0b1220"/><rect x="5" y="6" width="2" height="2" fill="#67e8f9"/><rect x="9" y="6" width="2" height="2" fill="#67e8f9"/><rect x="4" y="11" width="8" height="4" fill="#7c5cff"/><rect x="4" y="14" width="8" height="1" fill="#5b3fd1"/><rect x="2" y="11" width="2" height="3" fill="#22d3ee"/><rect x="12" y="11" width="2" height="3" fill="#22d3ee"/><rect x="14" y="8" width="1" height="5" fill="#fbbf24"/><rect x="14" y="13" width="1" height="1" fill="#e6f7ff"/><rect x="4" y="15" width="3" height="1" fill="#0b1220"/><rect x="9" y="15" width="3" height="1" fill="#0b1220"/></g></defs></svg>

<section id="loader" class="screen">
  <div class="stage"><div class="floor"></div><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div><svg class="mascot" viewBox="0 0 16 16" role="img" aria-label="Pixo, the Skin Studio mascot"><use href="#m"/></svg></div>
  <h1 class="logo">MINECRAFT SKIN STUDIO ULTRA</h1>
  <div class="bar"><i id="fill"></i></div>
  <p id="pct">0%</p><p id="msg" role="status"></p>
  <div id="ready" hidden><h2 data-i="ready"></h2><div class="row"><button id="start" class="pri" data-i="start"></button><button id="motion" data-i="motion"></button></div></div>
  <button id="retry" hidden aria-label="Retry">↻</button>
  <p class="credit"></p>
</section>

<section id="lang" class="screen" hidden>
  <svg class="mascot sm" viewBox="0 0 16 16"><use href="#m"/></svg>
  <h2 data-i="lang"></h2><p data-i="langSub"></p>
  <div id="lgrid"></div><p id="prev" class="prev"></p>
  <div class="row"><button id="lback" data-i="back"></button><button id="lnext" class="pri" data-i="next"></button></div>
</section>

<section id="name" class="screen" hidden>
  <svg class="mascot sm" viewBox="0 0 16 16"><use href="#m"/></svg>
  <h2 data-i="nameT"></h2><p data-i="nameH"></p>
  <input id="name-in" maxlength="20" autocomplete="off" spellcheck="false" aria-label="Display name">
  <p id="err" role="alert"></p>
  <div class="row"><button id="nback" data-i="back"></button><button id="nnext" class="pri" data-i="next"></button></div>
</section>

<div id="studio" hidden>
  <header>
    <svg class="mascot sm" viewBox="0 0 16 16"><use href="#m"/></svg><b>Skin Studio Ultra</b>
    <span id="who"></span><span id="state"></span><select id="ls" aria-label="Language"></select>
  </header>
  <nav id="bar">
    <button id="undo" data-g="↶" data-i="undo"></button><button id="redo" data-g="↷" data-i="redo"></button>
    <button id="nw" data-g="＋" data-i="newSkin"></button><button id="imp" data-g="⇧" data-i="imp"></button><button id="exp" class="pri" data-g="⇩" data-i="exp"></button>
    <button id="mS" class="on">Steve</button><button id="mA">Alex</button>
    <button id="gridB" class="on" data-g="▦" data-i="grid"></button><button id="uvB" data-i="uv"></button><button id="outB" class="on" data-i="outer"></button>
    <input type="file" id="file" accept="image/png" hidden>
  </nav>
  <main>
    <section id="view3d"><canvas id="gl"></canvas>
      <div class="views" id="views"><button data-v="F">F</button><button data-v="B">B</button><button data-v="L">L</button><button data-v="R">R</button><button data-v="T">T</button><button data-v="D">⊥</button></div>
    </section>
    <section id="edit">
      <div class="tools" id="tools"></div>
      <div class="tools"><input type="color" id="col" aria-label="Color"><span id="sw" class="tools"></span><input type="range" id="sz" min="1" max="4" value="1" aria-label="Brush size"><button id="zo">−</button><button id="zi">＋</button></div>
      <div id="scroller"><div id="wrap"><canvas id="skin" width="64" height="64"></canvas><canvas id="guide" width="512" height="512"></canvas></div></div>
      <p class="hint" data-i="hint"></p><p class="credit"></p>
    </section>
  </main>
</div>
<div id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="app.js" defer></script>
</body></html>
